name: Deploy to GitHub Pages

# main -> juliaan.eu/hockey/ (live), test -> juliaan.eu/hockey/test/. Pages heeft één site per repo, dus beide branches worden altijd samen gebouwd.
on:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: live
      - uses: actions/checkout@v4
        with:
          ref: test
          path: test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build live
        working-directory: live
        run: npm ci && npm run build
      - name: Build test
        working-directory: test
        run: npm ci && npm run build -- --mode test
      - name: Samenvoegen (juliaan.eu/hockey/ en /hockey/test/)
        run: |
          mkdir site
          cp -r live/dist site/hockey
          cp -r test/dist site/hockey/test
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=/hockey/"><a href="/hockey/">Hockey</a>' > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
